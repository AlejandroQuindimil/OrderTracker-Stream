server:
  port: 8081

spring:
  application:
    name: pedidos-service
  datasource:
    url: jdbc:postgresql://localhost:5432/pedidos
    username: pedidos
    password: pedidos
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer